name: CI

# Runs on every pull request and on main. A branch that would break the live
# site fails here, before Hussain ever looks at it — that is what "keep main
# deployable" means in practice.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, types, RTL, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check Arabic/RTL safety
        run: npm run check:rtl

      - name: Build
        run: npm run build
